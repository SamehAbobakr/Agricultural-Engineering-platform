<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كلية الهندسة الزراعية - جامعة الأزهر</title>
    <!-- روابط CSS الأساسية للمنصة -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- الهيدر العلوي للمنصة -->
    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <span class="logo-icon">🚜</span>
                <h1>كلية الهندسة الزراعية - جامعة الأزهر</h1>
            </div>
            <div class="user-info-area">
                <span class="welcome-text">مرحباً بك فى منصة الهندسة الزراعية </span>
            </div>
        </div>
    </header>

    <!-- الهيكل الرئيسي للصفحة (القائمة الجانبية ومساحة المحتوى) -->
    <div class="app-layout">
        
        <!-- القائمة الجانبية للتنقل -->
        <aside class="sidebar" id="sidebarContainer">
            <div class="sidebar-brand">قائمة التنقل</div>
            <ul class="sidebar-menu">
                <li class="menu-item active" onclick="resetView()">
                    <span class="menu-icon">🏠</span> الرئيسية
                </li>
                <li class="menu-item" onclick="selectGrade('الفرقة الأولى')">
                    <span class="menu-icon">📘</span> الفرقة الأولى
                </li>
                <li class="menu-item" onclick="selectGrade('الفرقة الثانية')">
                    <span class="menu-icon">📗</span> الفرقة الثانية
                </li>
                <li class="menu-item" onclick="selectGrade('الفرقة الثالثة')">
                    <span class="menu-icon">📙</span> الفرقة الثالثة
                </li>
                <li class="menu-item" onclick="selectGrade('الفرقة الرابعة')">
                    <span class="menu-icon">📕</span> الفرقة الرابعة
                </li>
            </ul>
        </aside>

        <!-- مساحة المحتوى الديناميكي الرئيسية -->
        <main class="content-area" id="contentArea">
            <!-- سيتم حقن المحتوى ديناميكياً بواسطة ملفات الجافاسكريبت -->
        </main>

    </div>

    <!-- الفوتر السفلي للمنصة -->
    <footer class="main-footer">
        <p>جميع الحقوق محفوظة © كلية الهندسة الزراعية - جامعة الأزهر 2026</p>
    </footer>

    <!-- ترتيب تحميل ملفات JavaScript بالترتيب الصحيح (مع إتاحة التوسع المستقبلي لـ Supabase) -->
    <script src="js/data.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ai-assistant.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
